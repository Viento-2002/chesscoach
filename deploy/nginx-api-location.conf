# Goes inside the server { } block of the chess site, next to the static files.
location /api/ {
    proxy_pass http://127.0.0.1:3011;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;   # overwritten, not appended: clients cannot fake their address
    client_max_body_size 256k;
    proxy_read_timeout 60s;
    gzip on;
    gzip_types application/json;
}
