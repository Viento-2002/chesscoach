# Goes inside the server { } block of the chess site, next to the static files.
location /api/ {
    proxy_pass http://127.0.0.1:3011;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;   # overwritten, not appended: clients cannot fake their address
    client_max_body_size 256k;
    proxy_read_timeout 90s;
    gzip on;
    gzip_types application/json;
}
# and inside the static "location /": add_header Cache-Control "no-cache" always;   (pages are revalidated, never stale)

# the web-app manifest needs its own content type:
# location = /manifest.webmanifest { default_type application/manifest+json; add_header Cache-Control "no-cache" always; }
