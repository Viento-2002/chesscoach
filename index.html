/* ======================================================================
   Analysis board: play any moves from a position and see Stockfish's top lines
   ====================================================================== */
Object.assign(S,{ex:null,vis:null});
let _engQ=Promise.resolve();
const engineJob=fn=>{const p=_engQ.then(fn,fn);_engQ=p.catch(()=>{});return p}; // one search at a time on the shared engine
function searchLines(fen,depth,ms){ // top lines (MultiPV is set by the caller) as [{t,v,pv:[uci],d}]
  return new Promise(res=>{
    const lines={};
    eng.set(l=>{
      if(l.startsWith('info')&&l.includes(' score ')&&!/bound/.test(l)){
        const m=l.match(/score (cp|mate) (-?\d+)/),pv=l.match(/ pv (.+)$/),mp=l.match(/ multipv (\d+)/),d=l.match(/ depth (\d+)/);
        if(m)lines[mp?+mp[1]:1]={t:m[1],v:+m[2],pv:pv?pv[1].trim().split(' ').slice(0,10):[],d:d?+d[1]:0};
      }else if(l.startsWith('bestmove'))res(Object.entries(lines).sort((a,b)=>a[0]-b[0]).map(x=>x[1]));
    });
    eng.send('position fen '+fen);eng.send(`go depth ${depth} movetime ${ms||4000}`);
  });
}
async function exSearch(){
  const ex=S.ex;if(!ex)return;
  const token=++ex.token;ex.lines=[];
  if(ex.chess.game_over()){ex.thinking=false;render();return}
  if(S.busy){ex.msg='Stop the running analysis first: the engine is busy.';ex.thinking=false;render();return}
  ex.msg='';ex.thinking=true;render();
  const fen=ex.chess.fen(),depth=ex.depth;
  const lines=await engineJob(async()=>{
    if(S.ex!==ex||token!==ex.token)return null; // you already moved on
    await getEngine();eng.send('setoption name MultiPV value 3');
    try{return await searchLines(fen,depth,depth>=20?9000:4000)}finally{eng.send('setoption name MultiPV value 2')}
  });
  if(!lines||S.ex!==ex||token!==ex.token)return;
  ex.lines=lines;ex.thinking=false;render();
}
function lineSan(fen,pv,max){const c=new Chess(fen),out=[];for(const u of pv.slice(0,max)){const m=c.move(parseUci(u));if(!m)break;out.push(m.san)}return out}
function exploreView(){

  const whiteCp=l=>l.t==='mate'?(l.v*sg>0?10000:-10000):l.v*sg;
  const evShow=l=>l.t==='mate'?(l.v*sg>0?'M':'-M')+Math.abs(l.v):(whiteCp(l)>=0?'+':'')+(whiteCp(l)/100).toFixed(1);
  const top=ex.lines[0],wp=top?winPct(whiteCp(top)):50;

  const over=c.in_checkmate()?`Checkmate: ${c.turn()==='w'?'Black':'White'} wins.`:c.in_stalemate()?'Stalemate: a draw.':c.in_draw()?'A draw.':'';
  const book=lineName(fen);
  let h=`<div class="ctl"><button data-a="exback">‹ Back to review</button><button data-a="exflip">⇅ Flip</button><button data-a="exundo" ${ex.hist.length?'':'disabled'}>↶ Undo</button><button data-a="exreset" ${ex.hist.length?'':'disabled'}>⟲ Reset</button></div>
    <div class="row"><div><div class="boardwrap"><div class="evalbar"><div style="${flip?'top':'bottom'}:0;height:${wp}%"></div></div>${boardHTML(fen,flip,ex.last,arrows,{click:true,sel:ex.sel,targets:ex.targets})}</div>
    <div class="mute hint" style="margin-top:6px">${c.turn()==='w'?'White':'Black'} to move${book?` · 📖 ${esc(niceName(book))}`:''}</div></div>
    <div class="side"><div class="card"><h3>🔬 Analysis board</h3><div class="mute hint" style="margin-bottom:8px">Move the pieces to try ideas. Stockfish shows its three best lines for the position on the board; tap a line to play its first move.</div>`;
  if(over)h+=`<div class="coach">${over}</div>`;

  else if(ex.thinking)h+='<div class="coach">Stockfish is thinking…</div>';
  else if(ex.lines.length){

  }

/* ======================================================================
   Vision trainer: know the board without looking at the coordinates
   ====================================================================== */
const VIS_SECONDS=30;
const randSq=not=>{let s;do{s='abcdefgh'[Math.floor(Math.random()*8)]+(1+Math.floor(Math.random()*8))}while(s===not);return s};
const isLightSq=s=>('abcdefgh'.indexOf(s[0])+ +s[1])%2===0; // a1 is dark, h1 is light
const visBest=m=>+(ls.get('cc:vis:'+m)||0);
function visStart(mode){
  clearInterval(S.visT);
  S.vis={mode,end:Date.now()+VIS_SECONDS*1000,score:0,miss:0,flip:Math.random()<.5,target:randSq(),state:'run',marks:null,best:visBest(mode)};
  S.visT=setInterval(visTick,250);render();
}
function visTick(){
  const v=S.vis;if(!v||v.state!=='run'){clearInterval(S.visT);return}
  const el=$('#visTime');if(el)el.textContent=Math.max(0,Math.ceil((v.end-Date.now())/1000))+'s';
  if(Date.now()>=v.end)visEnd();
}
function visEnd(){
  const v=S.vis;if(!v||v.state==='done')return;
  clearInterval(S.visT);v.state='done';v.marks=null;
  v.newBest=v.score>v.best;if(v.newBest)ls.set('cc:vis:'+v.mode,String(v.score));
  logTrain('vision',true);snd(v.newBest?'win':'good');render();
}
function visAnswer(ok,marks){
  const v=S.vis;if(ok){v.score++;snd('good')}else{v.miss++;snd('bad')}
  const old=v.target;v.target=randSq(old);v.marks=marks;render();
  setTimeout(()=>{if(S.vis===v&&v.marks===marks){v.marks=null;if(S.trainMode==='vision')render()}},350);
}
function visTap(sq){
  const v=S.vis;if(!v||v.state!=='run'||v.mode!=='coords')return;
  visAnswer(sq===v.target,[{sq:v.target,cls:'ok'},...(sq===v.target?[]:[{sq,cls:'no'}])]);
}
function visView(){
  const v=S.vis;
  if(!v){
    const card=(m,t,d)=>`<div class="brow" style="grid-template-columns:1fr auto;align-items:center;padding:8px 0;border-top:1px solid var(--line)"><div><b>${t}</b><div class="mute hint">${d}</div><div class="mute hint">Your best: <b>${visBest(m)}</b> in ${VIS_SECONDS} seconds</div></div><button class="primary" data-a="visstart" data-m="${m}">Start</button></div>`;
    return `<div class="card"><h3>Vision trainer</h3><p class="mute" style="margin:0">Strong players see the board without counting squares. ${VIS_SECONDS} seconds per round: score as many as you can. It counts as training for your streak.</p></div>
      <div class="card">${card('coords','Find the square','A square name appears (like e4). Tap it on the empty board. The coordinates are hidden.')}${card('color','Light or dark?','Is the square light or dark? Useful for bishops, pawn races and spotting skewers.')}</div>`;

/* ======================================================================
   Scout an opponent: what do they play, and how well does it work for them?
   Reads their public chess.com games straight from chess.com (nothing is stored).
   ====================================================================== */
S.scout=null;
const scoutKind=r=>r==='win'?'w':['agreed','repetition','stalemate','insufficient','50move','timevsinsufficient'].includes(r)?'d':'l';
async function scoutRun(name){
  name=String(name||'').trim().toLowerCase();
  if(!/^[a-z0-9_-]{2,40}$/.test(name)){S.scout={err:'Enter a chess.com username.'};render();return}
  S.scout={name,busy:true};render();
  try{
    let arch;try{arch=(await getJson(`https://api.chess.com/pub/player/${encodeURIComponent(name)}/games/archives`)).archives}
    catch(e){throw new Error(e.message==='not found'?`chess.com user "${name}" not found`:e.message)}
    const games=[];
    for(const url of arch.slice(-2).reverse()){try{games.push(...(await getJson(url)).games)}catch(e){/* month unavailable: use the rest */}}
    const sides={white:{},black:{}},tot={white:[0,0,0],black:[0,0,0]};let rating=null,n=0;
    for(const g of games){
      if(!g.pgn||g.rules!=='chess')continue;
      const side=(g.white.username||'').toLowerCase()===name?'white':(g.black.username||'').toLowerCase()===name?'black':null;
      if(!side)continue;
      n++;if(rating==null)rating=g[side].rating;
      const k=scoutKind(g[side].result),o=family(niceName(openingName(headersOf(g.pgn))));
      const rec=sides[side][o]||(sides[side][o]=[0,0,0]);
      const i=k==='w'?0:k==='d'?1:2;rec[i]++;tot[side][i]++;
    }
    const rows=side=>Object.entries(sides[side]).map(([o,r])=>({o,n:r[0]+r[1]+r[2],w:r[0],d:r[1],l:r[2]})).sort((a,b)=>b.n-a.n).slice(0,6);
    S.scout={name,n,rating,white:rows('white'),black:rows('black'),tot};
  }catch(e){S.scout={name,err:e.message}}
  render();
}
function scoutView(){
  const sc=S.scout||{};
  let h=`<div class="card"><h3>🕵 Scout an opponent</h3><p class="mute" style="margin-top:0">Playing someone tomorrow? See which openings they favour with each colour and how well those work for them, from their last two months of chess.com games. Prepare for the lines they play most.</p>
    <div class="ctl"><input id="scoutName" placeholder="chess.com username" value="${esc(sc.name||'')}" autocapitalize="none" autocorrect="off" spellcheck="false" style="flex:1"><button class="primary" data-a="scout" ${sc.busy?'disabled':''}>${sc.busy?'Looking…':'Scout'}</button></div></div>`;
  if(sc.err)return h+`<div class="card"><div class="coach bad">${esc(sc.err)}</div></div>`;
  if(sc.busy||!sc.white)return h;
  if(!sc.n)return h+`<div class="card"><div class="mute">No recent standard games found for ${esc(sc.name)}.</div></div>`;
  const block=(side,label)=>{
    const t=sc.tot[side],tn=t[0]+t[1]+t[2];
    if(!tn)return `<div class="card"><h3>${label}</h3><div class="mute">No games with this colour.</div></div>`;
    const rows=sc[side].map(r=>`<div class="exline" style="cursor:default"><div style="display:flex;justify-content:space-between;gap:8px"><b style="font-size:15px">${esc(r.o)}</b><span class="mute">${r.n} game${r.n===1?'':'s'} · ${pct(tn?r.n:0,tn)}%</span></div>
      <div class="mute hint">scores ${pct(r.w+r.d/2,r.n)}% · ${r.w}W ${r.d}D ${r.l}L</div></div>`).join('');
    return `<div class="card"><h3>${label}</h3><div class="mute hint" style="margin-bottom:6px">${tn} games · scores ${pct(t[0]+t[1]/2,tn)}% (${t[0]}W ${t[1]}D ${t[2]}L)</div>${rows}</div>`;
  };
  return h+`<div class="card"><div class="mute">${esc(sc.name)} · rating ${sc.rating||'?'} · ${sc.n} recent games</div></div>`+block('white','With White')+block('black','With Black');
}

S.pl=null;S.dp=null;S.dpLoading=false;
const PLAY_LEVELS=[[1350,'Beginner'],[1600,'Casual'],[1900,'Club'],[2300,'Strong'],[3000,'Maximum']];
function plBestMove(fen,elo){ // one move from the engine at the chosen strength; MultiPV and strength are put back afterwards
  return engineJob(async()=>{
    await getEngine();
    eng.send('setoption name MultiPV value 1');
    if(elo<3000){eng.send('setoption name UCI_LimitStrength value true');eng.send('setoption name UCI_Elo value '+elo)}
    try{
      return await new Promise(res=>{
        eng.set(l=>{if(l.startsWith('bestmove'))res(l.split(' ')[1])});
        eng.send('position fen '+fen);eng.send(elo<3000?'go movetime 700':'go depth 12 movetime 1500');
      });
    }finally{eng.send('setoption name UCI_LimitStrength value false');eng.send('setoption name MultiPV value 2')}
  });
}
function plStart(color){
  const col=color==='r'?(Math.random()<.5?'w':'b'):color,elo=S.plElo||1600;
  S.pl={chess:new Chess(),blind:!!S.plBlind,color:col,elo,state:'play',thinking:false,last:null,sel:null,targets:[],msg:'',token:0};
  render();if(col==='b')plReply();
}
function plOver(){
  const p=S.pl,c=p.chess;
  if(!c.game_over())return false;
  p.state='over';p.thinking=false;
  p.msg=c.in_checkmate()?(c.turn()===p.color?'Checkmate: Stockfish wins this one.':'Checkmate! You beat Stockfish 🎉'):c.in_stalemate()?'Stalemate: a draw.':'The game is drawn.';
  snd(c.in_checkmate()&&c.turn()!==p.color?'win':'good');
  if(c.history().length>=10)logTrain('play',true);
  render();return true;
}
async function plReply(){
  const p=S.pl;if(!p||p.state!=='play'||plOver())return;
  if(S.busy){p.msg='Stop the running analysis first: the engine is busy.';render();return}
  const token=++p.token;p.thinking=true;p.msg='';render();
  const u=await plBestMove(p.chess.fen(),p.elo);
  if(S.pl!==p||token!==p.token||p.state!=='play'||!u||u==='(none)')return;
  const mv=p.chess.move(parseUci(u));p.thinking=false;
  if(mv){p.last=[mv.from,mv.to];snd('move')}
  if(!plOver())render();
}
function plTap(sq){
  const p=S.pl;if(!p||p.state!=='play'||p.thinking||p.chess.turn()!==p.color)return;
  const c=p.chess,pc=c.get(sq);
  if(p.sel&&p.targets.includes(sq)){
    const mv=c.move({from:p.sel,to:sq,promotion:'q'});p.sel=null;p.targets=[];
    if(mv){p.last=[mv.from,mv.to];snd('move');if(!plOver())plReply()}
    return;
  }
  if(pc&&pc.color===c.turn()){p.sel=sq;p.targets=c.moves({square:sq,verbose:true}).map(m=>m.to)}else{p.sel=null;p.targets=[]}
  render();
}

async function dailyLoad(random){
  S.dpLoading=true;S.dp=null;render();
  try{
    const j=await getJson('https://api.chess.com/pub/puzzle'+(random?'/random':''));
    const sol=[],c=new Chess(j.fen);
    for(const san of sansOf(j.pgn||'')){const m=c.move(san);if(!m)break;sol.push({from:m.from,to:m.to,san:m.san})}
    if(!j.fen||!sol.length)throw new Error('the puzzle could not be read');
    S.dp={title:j.title||'Daily puzzle',fen:j.fen,sol,i:0,chess:new Chess(j.fen),sel:null,targets:[],last:null,state:'ask',msg:'',hint:false};
    S.dp.flip=S.dp.chess.turn()==='b';
  }catch(e){S.dp={err:e.message}}
  S.dpLoading=false;render();
}
function dailyCard(){
  const d=S.dp;
  if(S.dpLoading)return '<div class="card"><h3>📅 Daily puzzle</h3><div class="mute">Loading from chess.com…</div></div>';

function dpTap(sq){
  const d=S.dp;if(!d||d.err||d.state!=='ask'||d.busy)return;
  const c=d.chess,pc=c.get(sq);
  if(d.sel&&d.targets.includes(sq)){
    const want=d.sol[d.i],from=d.sel;d.sel=null;d.targets=[];d.hint=false;
    if(from!==want.from||sq!==want.to){d.msg='Not the best move. Try again.';snd('bad');render();return}
    const promo=(want.san.match(/=([QRBN])/)||[])[1];
    const mv=c.move({from,to:sq,promotion:promo?promo.toLowerCase():'q'});d.last=[mv.from,mv.to];d.msg='';snd('good');d.i++;
    if(d.i>=d.sol.length){d.state='done';logTrain('daily',true);snd('win');render();return}
    const reply=d.sol[d.i];d.busy=true;render();
    setTimeout(()=>{if(S.dp!==d)return;const m2=c.move({from:reply.from,to:reply.to,promotion:'q'});d.last=[m2.from,m2.to];d.i++;d.busy=false;
      if(d.i>=d.sol.length){d.state='done';logTrain('daily',true);snd('win')}render()},500);
    return;
  }
  if(pc&&pc.color===c.turn()){d.sel=sq;d.targets=c.moves({square:sq,verbose:true}).map(m=>m.to)}else{d.sel=null;d.targets=[]}
  render();
}

/* ======================================================================
   Puzzle Rush: three minutes, three strikes, puzzles from your own mistakes
   ====================================================================== */
S.rs=null;
const RUSH_SECONDS=180,RUSH_STRIKES=3;
const rushBest=()=>+(ls.get('cc:rush:'+S.user)||0);
function rushStart(){
  const pool=buildPuzzles();
  if(pool.length<3){S.rs={err:'You need at least 3 mistakes from analysed games to play Puzzle Rush. Analyse more games first.'};render();return}
  for(let i=pool.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[pool[i],pool[j]]=[pool[j],pool[i]]}
  clearInterval(S.rsT);
  S.rs={state:'run',pool,i:0,score:0,strikes:0,end:Date.now()+RUSH_SECONDS*1000,sel:null,targets:[],marks:[],best:rushBest(),fb:false};
  S.rsT=setInterval(rushTick,250);render();
}
function rushTick(){
  const r=S.rs;if(!r||r.state!=='run'){clearInterval(S.rsT);return}
  const el=$('#rsTime');if(el){const s=Math.max(0,Math.ceil((r.end-Date.now())/1000));el.textContent=Math.floor(s/60)+':'+pad2(s%60)}
  if(Date.now()>=r.end)rushEnd();
}
function rushEnd(){
  const r=S.rs;if(!r||r.state==='done')return;
  clearInterval(S.rsT);r.state='done';r.newBest=r.score>r.best;
  if(r.newBest)ls.set('cc:rush:'+S.user,String(r.score));
  if(r.score>0)logTrain('rush',true);
  snd(r.newBest?'win':'good');render();
}
function rushTap(sq){
  const r=S.rs;if(!r||r.state!=='run'||r.fb)return;
  const p=r.pool[r.i%r.pool.length],c=new Chess(p.fen),pc=c.get(sq);
  if(r.sel&&r.targets.includes(sq)){
    const from=r.sel,ok=from+sq===p.best.slice(0,4);r.sel=null;r.targets=[];
    if(ok){r.score++;snd('good');r.i++;r.marks=[];render();return}
    r.strikes++;snd('bad');r.fb=true;
    r.marks=[{sq:p.best.slice(2,4),cls:'ok'},{sq,cls:'no'}];render();
    setTimeout(()=>{if(S.rs!==r)return;r.fb=false;r.marks=[];r.i++;if(r.strikes>=RUSH_STRIKES)rushEnd();else render()},900);
    return;
  }
  if(pc&&pc.color===c.turn()){r.sel=sq;r.targets=c.moves({square:sq,verbose:true}).map(m=>m.to)}else{r.sel=null;r.targets=[]}
  render();
}
function rushView(){
  const r=S.rs;

    <div class="pz-actions"><button class="primary" data-a="rushstart">Start</button></div></div>`;
  if(r.state==='done')return `<div class="card"><h3>${r.newBest?'🏆 New best!':'Rush over'}</h3><div class="cards" style="margin:0"><div class="stat"><div class="mute">Solved</div><div class="big">${r.score}</div></div>

    <div class="pz-actions"><button class="primary" data-a="rushstart">Play again</button><button data-a="rushshare">Share</button><button data-a="rushquit">Back</button></div></div>`;
  const p=r.pool[r.i%r.pool.length],left=Math.max(0,Math.ceil((r.end-Date.now())/1000));
  return `<div class="card" style="display:flex;align-items:center;gap:14px"><div style="flex:1"><div class="mute hint">${p.color==='w'?'White':'Black'} to move</div><div class="big">${'❌'.repeat(r.strikes)}${'▫️'.repeat(RUSH_STRIKES-r.strikes)}</div></div>
    <div style="text-align:center"><div class="mute hint">Time</div><div class="big" id="rsTime">${Math.floor(left/60)}:${pad2(left%60)}</div></div><div style="text-align:center"><div class="mute hint">Solved</div><div class="big">${r.score}</div></div></div>
    <div class="boardwrap">${boardHTML(p.fen,p.color==='b',null,null,{click:true,sel:r.sel,targets:r.targets,marks:r.marks})}</div>
    <div style="margin-top:10px"><a href="#" data-a="rushquit" class="mute hint">Stop</a></div>`;
}
Object.assign(actions,{
  rushstart:()=>rushStart(),
  rushquit:()=>{clearInterval(S.rsT);S.rs=null;render()},
});

Object.assign(actions,{
  vtab:d=>{const T=S.tab==='games'&&S.rp?S.rp:S.tr;T.vw=d.k;T.vs=0;render()},
  vstep:d=>{const T=S.tab==='games'&&S.rp?S.rp:S.tr;T.vs=+d.s;render()},
  rpon:()=>{S.rp={g:curG(),k:S.cur,vw:'yours',vs:0};render()},
  rpoff:()=>{S.rp=null;render()},
});
/* ======================================================================
   Add your own game by playing the moves on a board
   ====================================================================== */
S.mb=null;S.impMode='pgn';
const mbNew=side=>({chess:new Chess(),side:side||'white',opp:'',result:'auto',sel:null,targets:[],last:null});
function mbView(){
  const m=S.mb||(S.mb=mbNew()),c=m.chess,flip=(m.side==='black')!==!!m.fl;
  const over=c.in_checkmate()?'Checkmate':c.in_stalemate()?'Stalemate':c.in_draw()?'Draw':'';
  const moves=c.history();
  let numbered='';moves.forEach((x,i)=>{numbered+=(i%2===0?(i/2+1)+'. ':'')+x+' '});
  return `<p class="mute hint">Play the moves of your game on the board, from the first move. Tap a piece, then the square it goes to (pawns promote to a queen).</p>
    <div class="row"><div><div class="boardwrap">${boardHTML(c.fen(),flip,m.last,null,{click:true,sel:m.sel,targets:m.targets})}</div>
    <div class="ctl"><button data-a="mbundo" ${moves.length?'':'disabled'}>↶ Undo</button><button data-a="mbreset" ${moves.length?'':'disabled'}>⟲ Clear</button><button data-a="mbflip">⇅ Flip</button></div></div>
    <div class="side"><div class="mute hint">${moves.length?moves.length+' move'+(moves.length===1?'':'s')+(over?' · '+over:' · '+(c.turn()==='w'?'White':'Black')+' to move'):'No moves yet'}</div>
    <div class="coach" style="min-height:44px">${numbered?esc(numbered):'<span class="mute">The moves will appear here.</span>'}</div>
    <div class="mute hint" style="margin-top:8px">I played</div>
    <div class="chips" style="margin:4px 0"><button class="chip ${m.side==='white'?'on':''}" data-a="mbside" data-s="white">White</button><button class="chip ${m.side==='black'?'on':''}" data-a="mbside" data-s="black">Black</button></div>
    <div class="ctl"><input id="mbOpp" placeholder="Opponent's name (optional)" value="${esc(m.opp)}" autocapitalize="none" autocorrect="off" spellcheck="false" style="flex:1 1 100%"></div>
    <div class="ctl"><label class="mute" style="flex:1 1 100%">Result <select id="mbRes" style="width:100%;margin-top:4px"><option value="auto" ${m.result==='auto'?'selected':''}>${over==='Checkmate'||over==='Stalemate'||over==='Draw'?'Automatic ('+over+')':'Choose the result…'}</option><option value="won" ${m.result==='won'?'selected':''}>I won</option><option value="lost" ${m.result==='lost'?'selected':''}>I lost</option><option value="draw" ${m.result==='draw'?'selected':''}>Draw</option></select></label></div>
    <div class="pz-actions"><button class="primary" data-a="mbadd" ${moves.length>=2?'':'disabled'}>Add this game</button></div>
    ${S.impMsg?`<div class="coach ${/^[1-9]d* game/.test(S.impMsg)&&!/skipped|could not/.test(S.impMsg)?'ok':'bad'}">${esc(S.impMsg)}</div>`:''}</div></div>`;
}
function mbTap(sq){
  const m=S.mb,c=m.chess,pc=c.get(sq);
  if(m.sel&&m.targets.includes(sq)){
    const mv=c.move({from:m.sel,to:sq,promotion:'q'});m.sel=null;m.targets=[];
    if(mv){m.last=[mv.from,mv.to];S.impMsg='';snd('move')}
    render();return;
  }
  if(pc&&pc.color===c.turn()){m.sel=sq;m.targets=c.moves({square:sq,verbose:true}).map(x=>x.to)}else{m.sel=null;m.targets=[]}
  render();
}
function mbAdd(){
  const m=S.mb,c=m.chess;
  let res=null;
  if(c.in_checkmate())res=c.turn()==='w'?'0-1':'1-0';
  else if(c.in_stalemate()||c.in_draw())res='1/2-1/2';
  else if(m.result==='won')res=m.side==='white'?'1-0':'0-1';
  else if(m.result==='lost')res=m.side==='white'?'0-1':'1-0';
  else if(m.result==='draw')res='1/2-1/2';
  if(!res){S.impMsg='Choose the result of the game first (I won, I lost or draw).';return}
  const me=plainName(S.user),opp=(m.opp||'').trim()||'Opponent';
  const g=new Chess();c.history().forEach(x=>g.move(x));
  g.header('Event','Own game','Site','ChessCoach','Date',new Date().toISOString().slice(0,10).replace(/-/g,'.'),
    'White',m.side==='white'?me:opp,'Black',m.side==='black'?me:opp,'Result',res);
  S.impMsg=importPgn(g.pgn(),m.side);
  if(/^[1-9]d* game/.test(S.impMsg))S.mb=mbNew(m.side);
}
Object.assign(actions,{
  impmode:d=>{S.impMode=d.m;S.impMsg='';render()},
  mbundo:()=>{const m=S.mb;m.chess.undo();m.last=null;m.sel=null;m.targets=[];render()},
  mbreset:()=>{S.mb=mbNew(S.mb.side);render()},
  mbflip:()=>{S.mb.fl=!S.mb.fl;render()},
  mbside:d=>{S.mb.side=d.s;S.mb.fl=false;render()},
  mbadd:()=>{mbAdd();render()},
});
document.addEventListener('input',e=>{if(e.target.id==='mbOpp'&&S.mb)S.mb.opp=e.target.value});
document.addEventListener('change',e=>{if(e.target.id==='mbRes'&&S.mb){S.mb.result=e.target.value;S.impMsg='';render()}});

/* ---------- start: reopen as the last user, no typing needed ---------- */
(function init(){
  loadBook();
  pushInit().then(()=>{if(S.user&&(S.tab==='progress'||S.tab==='train'))render()}).catch(()=>{});
  const route=hashRoute();if(route)openShared(route.key,route.gid,route.ply); // someone sent you a link to a review
  const open=hashOpen();if(open)S.pendingOpen=open;                              // a notification sent you to one of your games
  const m=ls.get('cc:months');if(m)$('#months').value=m;
  const u=ls.get('cc:user');
  if(u){$('#source').value=isLi(u)?'lichess':'chesscom';$('#user').value=plainName(u);syncPlaceholder();loadUser(u,true).catch(e=>showErr('loading',e))}else render();
})();
</script>
</body>
</html>
