<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#262421">
<title>ChessCoach</title>
<style>
:root{--bg:#161512;--panel:#262421;--panel2:#302e2b;--text:#e8e6e3;--mute:#9a9792;--accent:#81b64c;--light:#eeeed2;--dark:#769656;
--best:#81b64c;--good:#96af8b;--inacc:#f7c631;--mist:#e58f2a;--blun:#ca3431;--line:#3a3834;--gut:20px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.45 system-ui,Segoe UI,sans-serif}
header{display:flex;flex-wrap:wrap;gap:10px;align-items:center;padding:12px var(--gut);background:var(--panel);border-bottom:1px solid var(--line)}
header h1{font-size:20px;margin:0 12px 0 0}
input,select,button,textarea{font:inherit;color:var(--text);background:var(--panel2);border:1px solid var(--line);border-radius:6px;padding:8px 11px;min-height:38px}
input,select,textarea{font-size:16px} /* 16px stops iOS zooming into fields */
textarea{width:100%;min-height:110px;font:13px/1.4 ui-monospace,Consolas,monospace}
button{cursor:pointer}button:hover{background:#3b3935}
button.primary{background:var(--accent);color:#10200a;border-color:var(--accent);font-weight:600}
button.primary:hover{background:#92c85a}
button:disabled{opacity:.5;cursor:default}
nav{display:flex;gap:4px;padding:10px var(--gut) 0;overflow-x:auto;scrollbar-width:none}
nav::-webkit-scrollbar{display:none}
nav button{border-radius:6px 6px 0 0;border-bottom:none;background:transparent;white-space:nowrap}
nav button.on{background:var(--panel);border-color:var(--line)}
main{padding:16px var(--gut);max-width:1200px;margin:0 auto}
.card{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:14px;margin-bottom:14px}
.card h3{margin:0 0 10px;font-size:15px}
.mute{color:var(--mute)}.hint{font-size:13px}
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse}
th,td{text-align:left;padding:7px 8px;border-bottom:1px solid var(--line)}
th{color:var(--mute);font-weight:500;font-size:13px}
tr.click{cursor:pointer}tr.click:hover{background:var(--panel2)}
.badge{display:inline-block;min-width:22px;text-align:center;border-radius:4px;padding:1px 6px;font-weight:700;font-size:13px;color:#10200a}
.W{background:var(--best)}.L{background:var(--blun);color:#fff}.D{background:#8b8985}
.dot{display:inline-block;width:11px;height:11px;border-radius:50%;border:1px solid #888;margin-right:6px}
.dot.white{background:#fff}.dot.black{background:#000}
.row{display:flex;gap:18px;flex-wrap:wrap;align-items:flex-start}
.boardwrap{display:flex;gap:6px;align-items:stretch}
.board{position:relative;width:min(560px,calc(100vw - 2*var(--gut) - 28px));aspect-ratio:1;display:grid;grid-template-columns:repeat(8,1fr);border-radius:4px;overflow:hidden;touch-action:manipulation;user-select:none}
.board.click .sq{cursor:pointer}
.sq{position:relative}
.sq.l{background:var(--light)}.sq.d{background:var(--dark)}
.sq.hl::after{content:"";position:absolute;inset:0;background:rgba(255,235,60,.45)}
.sq.sel::after{content:"";position:absolute;inset:0;background:rgba(20,120,200,.5);z-index:2}
.sq img{position:absolute;inset:0;width:100%;height:100%;z-index:1;pointer-events:none}
.sq b{position:absolute;font-size:10px;color:#555;z-index:2;pointer-events:none}
.sq b.f{right:2px;bottom:1px}.sq b.r{left:2px;top:1px}
.sq i.tg{position:absolute;left:33%;top:33%;width:34%;height:34%;border-radius:50%;background:rgba(20,20,20,.28);z-index:3;pointer-events:none}
.board svg{position:absolute;inset:0;width:100%;height:100%;z-index:5;pointer-events:none}
.evalbar{width:20px;background:#333;border-radius:3px;position:relative;overflow:hidden;flex:none}
.evalbar div{position:absolute;left:0;right:0;background:#eee;transition:height .2s}
.side{flex:1;min-width:min(300px,100%)}
.cards{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.stat{background:var(--panel2);border-radius:8px;padding:8px 14px;min-width:100px;flex:1}
.stat .v{font-size:22px;font-weight:700}
.moves{display:grid;grid-template-columns:34px 1fr 1fr;gap:2px 6px;max-height:300px;overflow:auto}
.moves .n{color:var(--mute);text-align:right;padding-top:5px}
.mv{padding:5px 6px;border-radius:4px;cursor:pointer;white-space:nowrap}
.mv:hover{background:var(--panel2)}.mv.cur{background:#4b4944}
.c-best,.c-excellent{color:var(--best)}.c-good{color:var(--good)}
.c-inaccuracy{color:var(--inacc)}.c-mistake{color:var(--mist)}.c-blunder{color:var(--blun)}
.coach{border-left:4px solid var(--accent);padding:8px 12px;background:var(--panel2);border-radius:0 8px 8px 0;margin-bottom:12px}
.coach.inaccuracy{border-color:var(--inacc)}.coach.mistake{border-color:var(--mist)}.coach.blunder{border-color:var(--blun)}
.coach.bad{border-color:var(--blun)}.coach.ok{border-color:var(--best)}
.bar{height:8px;background:var(--panel2);border-radius:4px;overflow:hidden;display:flex;min-width:80px}
.bar i{display:block;height:100%}
.progress{height:6px;background:var(--panel2);border-radius:3px;overflow:hidden;margin-top:6px}
.progress i{display:block;height:100%;background:var(--accent);width:0}
.ctl{display:flex;gap:6px;margin:8px 0;flex-wrap:wrap;align-items:center}
.pz-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
@media (max-width:640px){
  :root{--gut:12px}
  body{font-size:14px}
  header h1{width:100%;margin:0}
  header input{flex:1 1 100%;min-width:0}
  header select{flex:1}
  #status{width:100%}
  .hm{display:none}
  .stat{min-width:calc(50% - 10px)}
  .stat .v{font-size:19px}
  .row{gap:10px}
  .side{min-width:100%}
  .moves{max-height:220px}
  .ctl button{flex:1}
  .ctl input[type=file]{flex:1 1 100%}
  .ctl label{flex:1 1 100%;display:flex;gap:8px;align-items:center}
  .ctl label select{flex:1}
  .pz-actions button{flex:1}
}
</style>
</head>
<body>
<header>
  <h1>♞ ChessCoach</h1>
  <input id="user" placeholder="chess.com username" autocomplete="off" autocapitalize="off" spellcheck="false">
  <select id="months"><option value="1">Last month</option><option value="2" selected>Last 2 months</option><option value="3">Last 3 months</option><option value="6">Last 6 months</option><option value="12">Last 12 months</option></select>
  <button id="load" class="primary">Load games</button>
  <span id="status" class="mute"></span>
</header>
<nav id="tabs">
  <button data-tab="games" class="on">Games</button>
  <button data-tab="train">Train</button>
  <button data-tab="openings">Openings</button>
  <button data-tab="insights">Insights</button>
</nav>
<main id="view"></main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
<script>
'use strict';
const SF_URL='engine/stockfish-18-lite-single.js';
const PIECE=(c,t)=>`https://cdn.jsdelivr.net/gh/lichess-org/lila@master/public/piece/cburnett/${c}${t.toUpperCase()}.svg`;
const VAL={p:1,n:3,b:3,r:5,q:9,k:0};
const NAME={p:'pawn',n:'knight',b:'bishop',r:'rook',q:'queen',k:'king'};
const LABEL={best:'Best move',excellent:'Excellent',good:'Good',inaccuracy:'Inaccuracy',mistake:'Mistake',blunder:'Blunder'};
const SYM={best:'★',excellent:'',good:'',inaccuracy:'?!',mistake:'?',blunder:'??'};
const DAYS=[0,1,3,7,21,60]; // spaced repetition: days until a puzzle comes back, by box
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const ls={get:k=>{try{return localStorage.getItem(k)}catch(e){return null}},set:(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}}};

const S={user:'',games:[],stored:[],byUrl:new Map(),meta:{synced:[]},train:{},tab:'games',sel:null,cur:0,flip:false,
  expl:[],explColor:'white',depth:14,busy:false,stop:false,prog:null,tr:null,showImport:false,pgnDraft:'',impMsg:''};

/* ---------- saved data (IndexedDB, per username) ---------- */
const DB={
  _p:null,
  open(){return this._p||(this._p=new Promise((res,rej)=>{const r=indexedDB.open('chesscoach',1);r.onupgradeneeded=()=>r.result.createObjectStore('kv');r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)}))},
  async get(k){const db=await this.open();return new Promise((res,rej)=>{const q=db.transaction('kv').objectStore('kv').get(k);q.onsuccess=()=>res(q.result);q.onerror=()=>rej(q.error)})},
  async set(k,v){const db=await this.open();return new Promise((res,rej)=>{const t=db.transaction('kv','readwrite');t.objectStore('kv').put(v,k);t.oncomplete=res;t.onerror=()=>rej(t.error)})},
  async all(prefix){const db=await this.open();return new Promise((res,rej)=>{const out={};const q=db.transaction('kv').objectStore('kv').openCursor(IDBKeyRange.bound(prefix,prefix+'￿'));
    q.onsuccess=()=>{const c=q.result;if(c){out[c.key.slice(prefix.length)]=c.value;c.continue()}else res(out)};q.onerror=()=>rej(q.error)})},
  async wipe(prefix){const db=await this.open();return new Promise((res,rej)=>{const t=db.transaction('kv','readwrite');t.objectStore('kv').delete(IDBKeyRange.bound(prefix,prefix+'￿'));t.oncomplete=res;t.onerror=()=>rej(t.error)})}
};
const K=(...a)=>[S.user.toLowerCase(),...a].join('|');
const save=(k,v)=>DB.set(k,v).catch(()=>{}); // saving is best effort: the app still works without storage

/* ---------- helpers ---------- */
const winPct=cp=>50+50*(2/(1+Math.exp(-0.00368208*Math.max(-1000,Math.min(1000,cp))))-1);
const cpOf=p=>p.m!=null?(p.m>0?10000:-10000):p.c;
const povCp=(p,color)=>color==='w'?cpOf(p):-cpOf(p);
function fmtEval(p){if(p.m!=null)return (p.m>0?'+':'-')+'M'+Math.abs(p.m);const v=p.c/100;return (v>0?'+':'')+v.toFixed(1)}
const uci=m=>m.from+m.to+(m.promotion||'');
const parseUci=u=>({from:u.slice(0,2),to:u.slice(2,4),promotion:u[4]});
function family(name){const m=name.match(/^(.*?(Defense|Opening|Game|Gambit|Attack|System))\b/);return m?m[1]:name.split(' ').slice(0,2).join(' ')}
const phase=i=>i<20?'opening':i<60?'middlegame':'endgame';
const posKey=fen=>fen.split(' ').slice(0,4).join(' ');
const hash=s=>{let h=5381;for(let i=0;i<s.length;i++)h=((h<<5)+h+s.charCodeAt(i))|0;return (h>>>0).toString(36)};
const setStatus=t=>{$('#status').textContent=t};

/* ---------- parsing games (chess.com API objects and imported PGN) ---------- */
function openingName(head){
  if(head.ECOUrl){const n=(head.ECOUrl.split('/openings/')[1]||'').replace(/(\.\.\.|-)\d+\..*$/,'').replace(/-/g,' ');if(n)return n}
  return head.Opening||head.ECO||'Unknown';
}
function build(pgn,metaFn){
  const c=new Chess();if(!c.load_pgn(pgn))return null;
  const head=c.header();if(head.FEN||head.SetUp==='1')return null;
  const moves=c.history({verbose:true});if(!moves.length)return null;
  const meta=metaFn(head);if(!meta)return null;
  const r=new Chess(),fens=[r.fen()];
  for(const m of moves){r.move(m.san);fens.push(r.fen())}
  const opening=openingName(head);
  return {...meta,myc:meta.me==='white'?'w':'b',opening,fam:family(opening),moves,sans:moves.map(m=>m.san),fens,p:null,rev:null};
}
function parseRaw(raw,user){
  if(raw.imported){
    return build(raw.pgn,h=>{
      const res=h.Result==='1-0'?(raw.side==='white'?'W':'L'):h.Result==='0-1'?(raw.side==='black'?'W':'L'):h.Result==='1/2-1/2'?'D':null;
      if(!res)return null;
      const white={username:h.White||'?',rating:+h.WhiteElo||0},black={username:h.Black||'?',rating:+h.BlackElo||0};
      const me=raw.side,opp=me==='white'?black:white,mine=me==='white'?white:black;
      const t=Date.parse((h.Date||'').replace(/\./g,'-'))/1000;
      return {url:raw.url,time:t||raw.added||0,tc:'import',me,res,opp:opp.username,oppR:opp.rating,myR:mine.rating,white,black};
    });
  }
  if(raw.rules!=='chess'||!raw.pgn)return null;
  const me=raw.white.username.toLowerCase()===user.toLowerCase()?'white':'black';
  const opp=raw[me==='white'?'black':'white'],mine=raw[me];
  const draws=['agreed','repetition','stalemate','insufficient','50move','timevsinsufficient'];
  const res=mine.result==='win'?'W':draws.includes(mine.result)?'D':'L';
  return build(raw.pgn,()=>({url:raw.url,time:raw.end_time,tc:raw.time_class,me,res,opp:opp.username,oppR:opp.rating,myR:mine.rating,white:raw.white,black:raw.black}));
}
const slim=r=>({url:r.url,pgn:r.pgn,time_class:r.time_class,end_time:r.end_time,rules:r.rules,
  white:{username:r.white.username,rating:r.white.rating,result:r.white.result},black:{username:r.black.username,rating:r.black.rating,result:r.black.result}});
function ingest(raw,persist){
  if(S.byUrl.has(raw.url))return false;
  const g=parseRaw(raw,S.user);if(!g)return false;
  if(persist)S.stored.push(raw.imported?raw:slim(raw));
  S.games.push(g);S.byUrl.set(raw.url,g);return true;
}
const sortGames=()=>S.games.sort((a,b)=>b.time-a.time);
const MAX_ANALYSE=100; // bulk analysis only covers the newest games; older ones can still be opened and analysed one by one
const recent=()=>S.games.slice(0,MAX_ANALYSE);

/* ---------- load saved data, then sync with chess.com ---------- */
async function loadUser(name,sync){
  name=name.trim();if(!name)return;
  S.user=name;S.games=[];S.stored=[];S.byUrl=new Map();S.meta={synced:[]};S.train={};S.sel=null;S.tr=null;
  ls.set('cc:user',name);ls.set('cc:months',$('#months').value);$('#user').value=name;
  try{
    const [games,meta,pm,tm]=await Promise.all([DB.get(K('games')),DB.get(K('meta')),DB.all(K('p')+'|'),DB.all(K('t')+'|')]);
    if(meta)S.meta=meta;
    (games||[]).forEach(raw=>ingest(raw,false));S.stored=games||[];
    S.games.forEach(g=>{if(pm[g.url]){try{g.p=pm[g.url];g.rev=review(g)}catch(e){g.p=null}}});
    S.train=tm||{};
  }catch(e){}
  sortGames();
  setStatus(S.games.length?`${S.games.length} saved games`:'');
  render();
  if(sync)await syncGames();
}
// Reads a chess.com answer as text first, so a non-JSON reply (blocked, rate-limited, cut off)
// gives a readable message instead of the browser's cryptic JSON error.
async function getJson(url){
  const r=await fetch(url),txt=await r.text();
  if(r.status===404)throw new Error('not found');
  if(!r.ok)throw new Error(`chess.com answered HTTP ${r.status}`);
  try{return JSON.parse(txt)}
  catch(e){throw new Error(`chess.com sent an unexpected answer (HTTP ${r.status}, ${txt.length} bytes: "${txt.slice(0,50).replace(/\s+/g,' ')}")`)}
}
function showErr(where,e){
  const msg=(e&&e.name&&e.name!=='Error'?e.name+': ':'')+((e&&e.message)||e);
  setStatus(`⚠ ${where}: ${msg}`);console.error(where,e);
}
async function syncGames(){
  const user=S.user;let stage='checking chess.com';
  setStatus('Checking chess.com for new games…');
  try{
    let all;
    try{all=(await getJson(`https://api.chess.com/pub/player/${encodeURIComponent(user.toLowerCase())}/games/archives`)).archives}
    catch(e){throw new Error(e.message==='not found'?`chess.com user "${user}" not found`:e.message)}
    const latest=all[all.length-1];
    const want=all.slice(-(+$('#months').value)).reverse();
    let added=0,failed=0,skipped=0;
    for(const [i,url] of want.entries()){
      if(S.meta.synced.includes(url)&&url!==latest)continue; // a finished month never changes
      stage=`loading month ${i+1} of ${want.length}`;setStatus(`Loading month ${i+1}/${want.length}…`);
      let data;try{data=await getJson(url)}catch(e){failed++;continue}
      stage=`reading games of month ${i+1}`;
      for(const raw of data.games){
        try{if(ingest(raw,true))added++}catch(e){skipped++} // one odd game must not stop the rest
      }
      if(url!==latest&&!S.meta.synced.includes(url))S.meta.synced.push(url);
      if(S.user!==user)return; // user switched meanwhile
    }
    stage='saving';sortGames();
    save(K('games'),S.stored);save(K('meta'),S.meta);
    setStatus(`${S.games.length} games${added?` (${added} new)`:''}${failed?` · ${failed} month(s) could not be loaded, press Load games to retry`:''}${skipped?` · ${skipped} unreadable game(s) skipped`:''}`);
  }catch(e){showErr(stage,e);if(S.games.length)$('#status').textContent+=' — showing saved games'}
  try{render()}catch(e){showErr('showing the page',e)}
}

/* ---------- import your own games (PGN) ---------- */
function importPgn(text,sideSel){
  const user=S.user;
  if(!user)return 'Enter your username above first (the name you play under in these games).';
  const chunks=text.split(/\r?\n(?=\[Event\s)/).map(s=>s.trim()).filter(Boolean);
  if(!chunks.length)return 'Paste a PGN first (or choose a .pgn file).';
  let added=0,dup=0,bad=0,unknown=0;
  for(const chunk of chunks){
    const c=new Chess();if(!c.load_pgn(chunk)){bad++;continue}
    const h=c.header(),u=user.toLowerCase();
    const side=sideSel!=='auto'?sideSel:(h.White||'').toLowerCase()===u?'white':(h.Black||'').toLowerCase()===u?'black':null;
    if(!side){unknown++;continue}
    const link=[h.Link,h.Site].find(x=>x&&/^https?:\/\/\S*chess\.com\/\S*game/.test(x));
    const url=link||'pgn:'+hash(chunk.replace(/\s+/g,' '));
    if(S.byUrl.has(url)){dup++;continue}
    if(ingest({imported:true,url,pgn:chunk,side,added:Math.floor(Date.now()/1000)},true))added++;else bad++;
  }
  if(added){sortGames();save(K('games'),S.stored)}
  const parts=[`${added} game${added===1?'':'s'} added`];
  if(dup)parts.push(`${dup} already there`);
  if(unknown)parts.push(`${unknown} skipped: "${user}" not found as White or Black — pick your colour below`);
  if(bad)parts.push(`${bad} could not be read (unfinished, from a custom position, or not valid PGN)`);
  return parts.join(' · ');
}

/* ---------- engine ---------- */
let eng=null;
async function getEngine(){
  if(eng)return eng;
  const w=new Worker(SF_URL);
  let h=null;w.onmessage=e=>h&&h(String(e.data));
  eng={send:m=>w.postMessage(m),set:f=>{h=f}};
  await new Promise(res=>{h=l=>{if(l==='readyok')res()};eng.send('uci');eng.send('isready')});
  return eng;
}
function search(fen,depth){
  return new Promise(res=>{
    let last={};
    eng.set(l=>{
      if(l.startsWith('info')&&l.includes(' score ')&&!/bound/.test(l)){
        const m=l.match(/score (cp|mate) (-?\d+)/),pv=l.match(/ pv (\S+)/);
        if(m)last={t:m[1],v:+m[2],pv:pv&&pv[1]};
      }else if(l.startsWith('bestmove'))res({...last,best:l.split(' ')[1]});
    });
    eng.send('position fen '+fen);eng.send('go depth '+depth);
  });
}
async function evalPos(fen,depth){
  const c=new Chess(fen),side=fen.split(' ')[1];
  if(c.in_checkmate())return {c:side==='w'?-10000:10000,m:null,b:null};
  if(c.game_over())return {c:0,m:null,b:null};
  const r=await search(fen,depth),sg=side==='w'?1:-1;
  if(r.t==='mate')return {c:null,m:r.v*sg,b:r.best};
  return {c:(r.v||0)*sg,m:null,b:r.best};
}
async function analyzeGame(g,onStep){
  await getEngine();eng.send('ucinewgame');
  const p=[];
  for(let k=0;k<g.fens.length;k++){
    if(S.stop)return false;
    p.push(await evalPos(g.fens[k],S.depth));
    onStep&&onStep(k+1,g.fens.length);
  }
  g.p=p;g.rev=review(g);
  save(K('p',g.url),p);
  return true;
}

/* ---------- review: classify moves ---------- */
function review(g){
  const moves=[],acc={w:[],b:[]};
  for(let i=0;i<g.moves.length;i++){
    const m=g.moves[i],c=m.color,before=g.p[i],after=g.p[i+1];
    const wb=winPct(povCp(before,c)),wa=winPct(povCp(after,c));
    const isBest=before.b&&uci(m)===before.b;
    const loss=isBest?0:Math.max(0,wb-wa);
    const cls=isBest?'best':loss<2?'excellent':loss<5?'good':loss<10?'inaccuracy':loss<20?'mistake':'blunder';
    let bestSan=null;
    if(before.b&&!isBest){const t=new Chess(g.fens[i]).move(parseUci(before.b));bestSan=t&&t.san}
    const tags=[];
    if(loss>=10&&after.b){
      const t=new Chess(g.fens[i+1]).move(parseUci(after.b));
      if(t&&t.captured&&VAL[t.captured]>=3&&VAL[t.captured]>(VAL[m.captured]||0))tags.push({k:'hung',piece:t.captured,san:t.san});
    }
    if(loss>=10&&before.b&&!isBest){
      const t=new Chess(g.fens[i]).move(parseUci(before.b));
      if(t&&t.captured&&VAL[t.captured]>=3&&!m.captured)tags.push({k:'missedcap',piece:t.captured,san:t.san});
      const mm=before.m!=null?(c==='w'?before.m:-before.m):0;
      if(mm>0)tags.push({k:'missedmate',san:t&&t.san});
    }
    acc[c].push(Math.max(0,Math.min(100,103.1668*Math.exp(-0.04354*loss)-3.1669)));
    moves.push({loss,cls,bestSan,tags,mover:c,i});
  }
  const avg=a=>a.length?a.reduce((x,y)=>x+y,0)/a.length:0;
  return {moves,acc:{w:avg(acc.w),b:avg(acc.b)},win:g.p.map(p=>winPct(cpOf(p)))};
}
function counts(g,color){
  const o={best:0,excellent:0,good:0,inaccuracy:0,mistake:0,blunder:0};
  g.rev.moves.forEach(m=>{if(m.mover===color)o[m.cls]++});return o;
}

/* ---------- board ---------- */
function boardHTML(fen,flip,last,arrows,o){
  o=o||{};
  const rows=fen.split(' ')[0].split('/');
  const grid=rows.map(r=>{const row=[];for(const ch of r){if(/\d/.test(ch))for(let i=0;i<+ch;i++)row.push(null);else row.push(ch)}return row});
  let h=`<div class="board${o.click?' click':''}">`;
  for(let y=0;y<8;y++)for(let x=0;x<8;x++){
    const r=flip?7-y:y,f=flip?7-x:x;
    const sq='abcdefgh'[f]+(8-r),pc=grid[r][f],light=(r+f)%2===0;
    h+=`<div class="sq ${light?'l':'d'}${last&&(sq===last[0]||sq===last[1])?' hl':''}${o.sel===sq?' sel':''}"${o.click?` data-a="tsq" data-sq="${sq}"`:''}>`;
    if(x===0)h+=`<b class="r">${8-r}</b>`;if(y===7)h+=`<b class="f">${'abcdefgh'[f]}</b>`;
    if(pc)h+=`<img src="${PIECE(pc===pc.toUpperCase()?'w':'b',pc)}" alt="">`;
    if(o.targets&&o.targets.includes(sq))h+='<i class="tg"></i>';
    h+='</div>';
  }
  if(arrows&&arrows.length){
    const xy=s=>{const f='abcdefgh'.indexOf(s[0]),r=8-+s[1];return [(flip?7-f:f)+.5,(flip?7-r:r)+.5]};
    h+='<svg viewBox="0 0 8 8"><defs>';
    arrows.forEach((a,i)=>h+=`<marker id="ah${i}" markerWidth="4" markerHeight="4" refX="2.5" refY="2" orient="auto"><path d="M0,0 L4,2 L0,4 z" fill="${a.color}"/></marker>`);
    h+='</defs>';
    arrows.forEach((a,i)=>{const [x1,y1]=xy(a.from),[x2,y2]=xy(a.to);
      h+=`<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="${a.color}" stroke-width=".16" opacity=".8" marker-end="url(#ah${i})"/>`});
    h+='</svg>';
  }
  return h+'</div>';
}

  if(['inaccuracy','mistake','blunder'].includes(x.cls)){

    x.tags.forEach(tag=>{
      if(tag.k==='hung')t+=`<br>⚠ This leaves your position open to <b>${tag.san}</b>, winning a ${NAME[tag.piece]}.`;
      if(tag.k==='missedcap')t+=`<br>⚠ ${tag.san} would have won a ${NAME[tag.piece]}.`;

  }

function graph(g){

  return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;cursor:pointer;background:#333;border-radius:6px" data-a="graph" id="gsvg">
    <rect x="0" y="${H/2}" width="${W}" height="${H/2}" fill="#1b1a18"/><line x1="0" x2="${W}" y1="${H/2}" y2="${H/2}" stroke="#555"/>
    <polyline points="${pts}" fill="none" stroke="#eee" stroke-width="2"/><line x1="${cx}" x2="${cx}" y1="0" y2="${H}" stroke="#81b64c"/></svg>`;
}

/* ---------- train your mistakes ---------- */
// One puzzle per position where you lost >=10% win chance (and were not already lost).
function buildPuzzles(){
  const map={};
  S.games.forEach(g=>{
    if(!g.rev)return;
    g.rev.moves.forEach(m=>{
      if(m.mover!==g.myc||m.loss<10)return;
      const before=g.p[m.i];if(!before.b)return;
      if(winPct(povCp(before,m.mover))<15)return;
      const key=posKey(g.fens[m.i]);
      const o=map[key]=map[key]||{key,fen:g.fens[m.i],color:m.mover,best:before.b,bestSan:m.bestSan,before,g,i:m.i,n:0,loss:0,times:[]};
      o.n++;o.loss=Math.max(o.loss,m.loss);o.times.push(g.time);
    });
  });
  return Object.values(map);
}

function trainStart(all){
  const pz=buildPuzzles();
  let list=(all?pz:pz.filter(isDue)).sort((a,b)=>b.n-a.n||b.loss-a.loss);
  if(!all)list=list.slice(0,10);
  if(all)list=list.sort(()=>Math.random()-.5).slice(0,20);
  if(!list.length)return;
  S.tr={queue:list.map(p=>p.key),idx:0,n:0,right:0,retried:new Set()};resetPuzzle();
}
function resetPuzzle(){Object.assign(S.tr,{state:'ask',sel:null,targets:[],last:null,hint:false,counted:false,played:'',msg:''})}
function curPuzzle(){return buildPuzzles().find(x=>x.key===S.tr.queue[S.tr.idx])}
function updateProgress(p,success){
  const t=S.tr;if(t.counted)return;t.counted=true;t.n++;if(success)t.right++;
  const pr=S.train[p.key]||{box:0,due:0,seen:0,ok:0};
  pr.seen++;
  if(success){pr.ok++;pr.box=Math.min(5,pr.box+1);pr.due=Date.now()+DAYS[pr.box]*864e5}
  else{pr.box=0;pr.due=Date.now()+10*60e3;
    if(!t.retried.has(p.key)){t.retried.add(p.key);t.queue.push(p.key)} // see it again at the end of this session
  }
  S.train[p.key]=pr;save(K('t',p.key),pr);
}
async function trainMove(from,to){
  const t=S.tr,p=curPuzzle(),c=new Chess(p.fen),mv=c.move({from,to,promotion:'q'});
  if(!mv)return;
  const u=from+to+(mv.promotion||'');
  Object.assign(t,{sel:null,targets:[],last:[from,to],played:mv.san});
  if(u===p.best){updateProgress(p,true);t.state='right';t.msg=`Correct! <b>${mv.san}</b> is the best move.`;render();return}
  const sameMistake=buildPuzzles().length&&p.g.moves[p.i].san===mv.san;
  if(sameMistake){updateProgress(p,false);t.state='wrong';t.msg=`<b>${mv.san}</b> is the move you played in the game — that was the mistake. Look for something else.`;render();return}
  if(S.busy){updateProgress(p,false);t.state='wrong';t.msg=`<b>${mv.san}</b> isn’t the engine’s choice. (Stop the running analysis to let Stockfish judge alternatives.)`;render();return}
  t.state='thinking';render();
  await getEngine();
  const r=await evalPos(c.fen(),14);
  const loss=winPct(povCp(p.before,p.color))-winPct(povCp(r,p.color));
  if(S.tr!==t||S.tr.state!=='thinking')return;
  if(loss<4){updateProgress(p,true);t.state='right';t.msg=`<b>${mv.san}</b> is also strong — Stockfish rates it about as good as the top move.`}
  else{updateProgress(p,false);t.state='wrong';t.msg=`<b>${mv.san}</b> isn’t it — it gives away about ${loss.toFixed(0)}% win chance.`}
  render();
}

    h+=`<tr class="click" data-a="emove" data-s="${s}"><td><b>${s}</b></td><td>${o.n}</td>
      <td><div class="bar"><i style="width:${o.W/o.n*100}%;background:var(--best)"></i><i style="width:${o.D/o.n*100}%;background:#8b8985"></i><i style="width:${o.L/o.n*100}%;background:var(--blun)"></i></div><span class="mute hint">${o.W}/${o.D}/${o.L}</span></td>
      <td>${((o.W+o.D/2)/o.n*100).toFixed(0)}%</td></tr>`;
  });
  if(!rows.length)h+='<tr><td colspan="4" class="mute">No games continue from here.</td></tr>';
  h+='</table></div></div></div></div>';
  const fam={};
  S.games.forEach(g=>{const key=g.me+'|'+g.fam;const o=fam[key]=fam[key]||{me:g.me,fam:g.fam,W:0,D:0,L:0,n:0,loss:[]};
    o.n++;o[g.res]++;
    if(g.rev)g.rev.moves.forEach(m=>{if(m.mover===g.myc&&m.i<20)o.loss.push(m.loss)})});
  h+=`<div class="card tw"><h3>Openings you play</h3><table><tr><th>Opening</th><th>Colour</th><th>Games</th><th class="hm">W / D / L</th><th>Score</th><th class="hm">Win-chance lost per opening move</th></tr>`;
  Object.values(fam).sort((a,b)=>b.n-a.n).forEach(o=>{
    const sc=(o.W+o.D/2)/o.n*100;
    const l=o.loss.length?(o.loss.reduce((a,b)=>a+b,0)/o.loss.length).toFixed(1)+'%':'<span class="mute">analyse games</span>';
    h+=`<tr><td>${esc(o.fam)}</td><td><span class="dot ${o.me}"></span>${o.me}</td><td>${o.n}</td><td class="hm">${o.W}/${o.D}/${o.L}</td>
      <td style="color:${sc<45?'var(--blun)':sc>55?'var(--best)':'inherit'}">${sc.toFixed(0)}%</td><td class="hm">${l}</td></tr>`;
  });
  return h+'</table></div>';
}

/* ---------- insights tab ---------- */
function insightsView(){
  const an=S.games.filter(g=>g.rev);
  if(!an.length)return '<div class="card">Analyse some games first (Games tab) to get personal insights.</div>';
  let acc=0,tot={blunder:0,mistake:0,inaccuracy:0},ph={opening:[],middlegame:[],endgame:[]},hung=0,mcap=0,mmate=0;
  const rep={},fl={};
  an.forEach(g=>{
    acc+=g.rev.acc[g.myc];
    g.rev.moves.forEach(m=>{
      if(m.mover!==g.myc)return;
      if(tot[m.cls]!==undefined)tot[m.cls]++;
      ph[phase(m.i)].push(m.loss);
      m.tags.forEach(t=>{if(t.k==='hung')hung++;if(t.k==='missedcap')mcap++;if(t.k==='missedmate')mmate++});
      if(m.i<20)(fl[g.fam]=fl[g.fam]||[]).push(m.loss);
      if(m.i<24&&m.loss>=10){
        const key=posKey(g.fens[m.i])+'|'+uci(g.moves[m.i]);
        const o=rep[key]=rep[key]||{n:0,g,m,loss:0};o.n++;o.loss+=m.loss;
      }
    });
  });
  const avg=a=>a.length?a.reduce((x,y)=>x+y,0)/a.length:0,n=an.length;
  const phv=Object.entries(ph).map(([k,v])=>[k,avg(v)]);
  const worst=phv.slice().sort((a,b)=>b[1]-a[1])[0];
  let h=`<div class="cards">
    <div class="stat"><div class="mute">Games analysed</div><div class="v">${n}</div></div>
    <div class="stat"><div class="mute">Avg. accuracy</div><div class="v">${(acc/n).toFixed(0)}%</div></div>
    <div class="stat"><div class="mute">Blunders / game</div><div class="v c-blunder">${(tot.blunder/n).toFixed(1)}</div></div>
    <div class="stat"><div class="mute">Mistakes / game</div><div class="v c-mistake">${(tot.mistake/n).toFixed(1)}</div></div>
    <div class="stat"><div class="mute">Inaccuracies / game</div><div class="v c-inaccuracy">${(tot.inaccuracy/n).toFixed(1)}</div></div></div>
    <div class="card"><h3>Where you lose the most</h3><p>Your biggest leak is the <b>${worst[0]}</b>.</p>
    <div class="tw"><table>${phv.map(([k,v])=>`<tr><td style="width:110px">${k}</td><td><div class="bar"><i style="width:${Math.min(100,v*10)}%;background:${k===worst[0]?'var(--mist)':'var(--good)'}"></i></div></td><td style="width:130px">${v.toFixed(1)}% per move</td></tr>`).join('')}</table></div></div>
    <div class="card"><h3>Recurring patterns</h3><ul style="margin:0;padding-left:20px">
      <li>Pieces left hanging after a bad move: <b>${hung}</b> times</li>
      <li>Free pieces you missed: <b>${mcap}</b> times</li>
      <li>Forced mates you missed: <b>${mmate}</b> times</li></ul>
      <p class="mute hint" style="margin-bottom:0">Fix these in the <a href="#" data-a="gotrain">Train tab</a>.</p></div>`;
  const reps=Object.values(rep).sort((a,b)=>b.n-a.n||b.loss-a.loss).slice(0,10);
  h+=`<div class="card tw"><h3>Opening mistakes to fix</h3><div class="mute hint" style="margin-bottom:6px">Moves 1–12 where you lost ≥10% win chance. Repeats (×2, ×3…) are the best things to study.</div><table><tr><th></th><th>Opening</th><th>You played</th><th>Better</th><th>Move</th></tr>`;
  reps.forEach(o=>{const i=o.m.i;
    h+=`<tr class="click" data-a="open" data-i="${S.games.indexOf(o.g)}" data-k="${i+1}"><td>${o.n>1?'×'+o.n:''}</td><td>${esc(o.g.opening)}</td><td class="c-${o.m.cls}">${o.g.moves[i].san}</td><td class="c-best">${o.m.bestSan||'–'}</td><td class="mute">${Math.floor(i/2)+1}${i%2?'…':'.'}</td></tr>`});
  if(!reps.length)h+='<tr><td colspan="5" class="mute">No big opening mistakes — nice!</td></tr>';
  h+='</table></div>';
  const fls=Object.entries(fl).filter(([,v])=>v.length>=6).map(([k,v])=>[k,avg(v)]).sort((a,b)=>b[1]-a[1]).slice(0,5);
  if(fls.length)h+=`<div class="card tw"><h3>Openings that cost you the most</h3><table>${fls.map(([k,v])=>`<tr><td>${esc(k)}</td><td>${v.toFixed(1)}% lost per opening move</td></tr>`).join('')}</table></div>`;
  return h;
}

/* ---------- events ---------- */
async function runAnalysis(list){
  if(S.busy||!list.length)return;
  S.busy=true;S.stop=false;render();
  let done=0,err=null;
  try{
    for(const g of list){
      const ok=await analyzeGame(g,(k,n)=>{
        S.prog=((done+k/n)/list.length)*100;
        const b=$('#pbar');if(b)b.style.width=S.prog+'%';
        const t=$('#ptxt');if(t)t.textContent=`Game ${done+1}/${list.length} · position ${k}/${n}`;
      });
      if(!ok)break;done++;
    }
  }catch(e){err=e}
  S.busy=false;S.prog=null;render();
  if(err)showErr('analysing games',err);
}
const actions={
  open:d=>{S.sel=+d.i;S.cur=d.k?+d.k:0;S.flip=false;S.tab='games';render();scrollTo(0,0)},
  back:()=>{S.sel=null;render()},
  flip:()=>{S.flip=!S.flip;render()},
  nav:d=>{const g=S.games[S.sel];S.cur=Math.max(0,Math.min(g.moves.length,+d.k));render()},
  graph:(d,e)=>{const g=S.games[S.sel],r=$('#gsvg').getBoundingClientRect();
    S.cur=Math.max(0,Math.min(g.moves.length,Math.round((e.clientX-r.left)/r.width*g.moves.length)));render()},
  analyzeAll:()=>runAnalysis(recent().filter(g=>!g.p)),
  analyze10:()=>runAnalysis(recent().filter(g=>!g.p).slice(0,10)),
  analyzeOne:()=>runAnalysis([S.games[S.sel]]),
  stop:()=>{S.stop=true},
  ecol:d=>{S.explColor=d.c;S.expl=[];render()},
  emove:d=>{S.expl.push(d.s);render()},
  eback:()=>{S.expl.pop();render()},
  ereset:()=>{S.expl=[];render()},
  toggleImport:()=>{S.showImport=!S.showImport;render()},
  importPgn:()=>{S.impMsg=importPgn($('#pgnText').value,$('#pgnSide').value);if(/^\d+ game/.test(S.impMsg)&&!/^0 game/.test(S.impMsg)){S.pgnDraft='';}render()},
  wipe:()=>{if(confirm(`Delete all saved games, analysis and training progress for "${S.user}" from this browser?`)){
    DB.wipe(S.user.toLowerCase()+'|').catch(()=>{}).then(()=>{ls.set('cc:user','');S.user='';S.games=[];S.stored=[];S.byUrl=new Map();S.train={};S.tr=null;S.sel=null;$('#user').value='';setStatus('');render()})}},
  gotrain:()=>{S.tab='train';render()},
  tstart:()=>{trainStart(false);render()},
  tstartall:()=>{trainStart(true);render()},
  tquit:()=>{S.tr=null;render()},
  tsq:d=>{
    const t=S.tr;if(!t||t.state!=='ask')return;
    const p=curPuzzle(),c=new Chess(p.fen),pc=c.get(d.sq);
    if(t.sel&&t.targets.includes(d.sq)){trainMove(t.sel,d.sq);return}
    if(pc&&pc.color===p.color){t.sel=d.sq;t.hint=false;t.targets=c.moves({square:d.sq,verbose:true}).map(m=>m.to)}
    else{t.sel=null;t.targets=[]}
    render();
  },
  thint:()=>{S.tr.hint=true;render()},
  tretry:()=>{Object.assign(S.tr,{state:'ask',sel:null,targets:[],last:null,msg:''});render()},
  treveal:()=>{const p=curPuzzle();updateProgress(p,false);S.tr.state='answer';S.tr.last=null;render()},
  tskip:()=>{S.tr.idx++;if(S.tr.idx>=S.tr.queue.length)S.tr.state='done';else resetPuzzle();render()},
  tnext:()=>{S.tr.idx++;if(S.tr.idx>=S.tr.queue.length)S.tr.state='done';else resetPuzzle();render();scrollTo(0,0)},
};
document.addEventListener('click',e=>{
  const t=e.target.closest('[data-a]');
  if(t&&actions[t.dataset.a]){if(t.tagName==='A')e.preventDefault();actions[t.dataset.a](t.dataset,e)}
  const tab=e.target.closest('#tabs button');if(tab){S.tab=tab.dataset.tab;S.sel=null;render()}
});
document.addEventListener('change',e=>{
  if(e.target.id==='depth')S.depth=+e.target.value;
  if(e.target.id==='pgnFile'&&e.target.files[0]){
    const fr=new FileReader(); // FileReader works on older iPhones where Blob.text() does not
    fr.onload=()=>{S.pgnDraft=String(fr.result);const ta=$('#pgnText');if(ta)ta.value=S.pgnDraft};
    fr.readAsText(e.target.files[0]);
  }
});
document.addEventListener('input',e=>{if(e.target.id==='pgnText')S.pgnDraft=e.target.value});
document.addEventListener('keydown',e=>{
  if(S.tab==='games'&&S.sel!=null&&S.games[S.sel]&&S.games[S.sel].rev&&!/INPUT|SELECT|TEXTAREA/.test(e.target.tagName)){
    if(e.key==='ArrowLeft')actions.nav({k:S.cur-1});
    if(e.key==='ArrowRight')actions.nav({k:S.cur+1});
  }
  if(e.key==='Enter'&&e.target.id==='user')loadUser($('#user').value,true);
});
$('#load').onclick=()=>loadUser($('#user').value,true).catch(e=>showErr('loading',e));
// Anything unexpected is shown on screen (and in the console) instead of failing silently.
addEventListener('error',ev=>showErr('unexpected error',ev.error||ev.message));
addEventListener('unhandledrejection',ev=>showErr('unexpected error',ev.reason));

/* ---------- start: reopen as the last user, no typing needed ---------- */
(function init(){
  const m=ls.get('cc:months');if(m)$('#months').value=m;
  const u=ls.get('cc:user');
  if(u){$('#user').value=u;loadUser(u,true).catch(e=>showErr('loading',e))}else render();
})();
</script>
